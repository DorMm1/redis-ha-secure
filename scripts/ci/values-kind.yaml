# Overrides for the local kind test cluster (1 control plane + 3 workers):
# no Linkerd / Prometheus Operator CRDs, small resources, catalog from catalog-example.
linkerd:
  enabled: false
monitoring:
  podMonitor:
    enabled: false
  prometheusRule:
    enabled: false
networkPolicy:
  egress:
    linkerdControlPlane: []
redis-ha:
  persistentVolume:
    size: 1Gi
  redis:
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 512Mi }
    # kind is slow to start containers. Keep the chart probes but shorten delays.
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
    livenessProbe:
      initialDelaySeconds: 10
    startupProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30
  sentinel:
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
      successThreshold: 1
    config:
      down-after-milliseconds: 5000
      failover-timeout: 60000
      parallel-syncs: 1
      maxclients: 10000
aclUsers:
  - namespace: orders
    serviceAccount: orders-api
    redis:
      - keyPrefix: "orders:"
        access: [read, write]
      - channel: "orders.events.*"
        access: [publish, subscribe]
  - namespace: reporting
    serviceAccount: report-reader
    passwordSecret: { name: reporting-redis, key: password }
    scripting: true
    redis:
      - keyPrefix: "orders:"
        access: [read]
      - keyPrefix: "reports:"
        access: [write]
      - channel: "orders.events.*"
        access: [subscribe]
